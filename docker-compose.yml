services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    # No host port published: `app` reaches this service at http://ollama:11434
    # over the internal network, avoiding a clash with a native Ollama install.
    # Uncomment to expose it for debugging from the host.
    # ports:
    #   - "11435:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    # gemma4:31b is not viable on CPU, so the GPU reservation is required.
    # Needs the NVIDIA driver and nvidia-container-toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build: .
    depends_on:
      - ollama
    # Linux does not resolve host.docker.internal by default. Required when
    # OLLAMA_BASE_URL points at a native Ollama on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Published on 5050 in case 5000 is taken by a native run of this app.
      # The container always listens on 5000.
      - "5050:5000"
    # SAM3 runs on CUDA when available and falls back to CPU, which is too slow
    # for a full survey. The GPU reservation is required for live runs.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      LLM_PROFILE: ollama
      # Defaults to the internal `ollama` service. Override with
      # http://host.docker.internal:11434/v1 to use a native Ollama on the host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL_TAG: gemma4:31b
      MODEL_VISION: gemma4:31b
      MAPILLARY_TOKEN: ${MAPILLARY_TOKEN:-}
      HF_TOKEN: ${HF_TOKEN:-}
      SAM3_DIR: /app/weights/sam3
      RUNS_DIR: /app/runs
    volumes:
      - ./runs:/app/runs
      - ./weights:/app/weights
      - ./fixtures:/app/fixtures
    restart: unless-stopped

volumes:
  ollama-models:
